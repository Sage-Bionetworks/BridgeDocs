sudo: false
language: python
python: 3.5
cache: pip
fast_finish: true
branches:
  only:
  - release
before_install:
  - rvm install "ruby-2.7.6"
  - rvm use "ruby-2.7.6"
  - gem install bundler -v 2.4.22
install:
- wget https://github.com/Sage-Bionetworks/infra-utils/archive/v1.0.9.zip -O /tmp/infra-utils.zip
- unzip -j -n /tmp/infra-utils.zip -x infra-utils-v1.0.9/.gitignore infra-utils-v1.0.9/LICENSE infra-utils-v1.0.9/README.md
- ./setup_aws_cli.sh || travis_terminate 1
script:
- rvm install "ruby-2.7.6"
- rvm use "ruby-2.7.6"
- gem install bundler -v 2.4.22
- bundle install
- bundle exec jekyll build
- aws s3 cp _site/ s3://developer.sagebridge.org/ --recursive --acl public-read
